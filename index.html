<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.jpeg" type="image/jpeg">
    <title>AiD</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        pulse: {
                            '0%, 100%': { opacity: 1 },
                            '50%': { opacity: .5 },
                        }
                    },
                    animation: {
                        pulse: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Main Application Card -->
    <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-xl w-full">
        <h1 class="text-center mb-8">
            <img src="logo.jpeg" alt="AiD Logo" class="mx-auto h-16 w-auto">
        </h1>

        <div class="space-y-6">

            <!-- API Selection -->
            <div class="hidden">
                <label class="block text-lg font-medium text-gray-700 mb-3">
                    Select AI Provider:
                </label>
                <fieldset class="flex flex-col sm:flex-row sm:space-x-4 space-y-2 sm:space-y-0">
                    <label for="api-select-gemini"
                           class="flex items-center p-3 w-full border border-gray-300 rounded-lg has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 cursor-pointer">
                        <input type="radio" id="api-select-gemini" name="api-provider" value="gemini"
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300" checked>
                        <span class="ml-3 text-base font-medium text-gray-700">Gemini</span>
                    </label>
                    <label for="api-select-openai"
                           class="flex items-center p-3 w-full border border-gray-300 rounded-lg has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 cursor-pointer">
                        <input type="radio" id="api-select-openai" name="api-provider" value="openai"
                               class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                        <span class="ml-3 text-base font-medium text-gray-700">OpenAI</span>
                    </label>
                </fieldset>
            </div>

            <!-- Task Selection -->
            <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
                <div class="md:col-span-1">
                    <label class="block text-lg font-medium text-gray-700 mb-2">Ročník:</label>
                    <div id="rocnik-checkbox-group" class="space-y-2">
                        <!-- Checkboxes will be dynamically styled -->
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="1" class="h-4 w-4 rounded mr-3">1. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="2" class="h-4 w-4 rounded mr-3">2. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="3" class="h-4 w-4 rounded mr-3">3. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="4" class="h-4 w-4 rounded mr-3">4. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="5" class="h-4 w-4 rounded mr-3">5. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="6" class="h-4 w-4 rounded mr-3">6. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="7" class="h-4 w-4 rounded mr-3">7. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="8" class="h-4 w-4 rounded mr-3">8. ročník</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="rocnik" value="9" class="h-4 w-4 rounded mr-3">9. ročník</label>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-lg font-medium text-gray-700 mb-2">Skupiny na diferenciáciu:</label>
                    <div id="skupina-checkbox-group" class="space-y-2">
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Intaktný žiak - pokojné tempo" class="h-4 w-4 rounded mr-3">Intaktný žiak - pokojné tempo</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Intaktný žiak - rýchlejšie tempo" class="h-4 w-4 rounded mr-3">Intaktný žiak - rýchlejšie tempo</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Intaktný žiak - najrýchlejšie tempo" class="h-4 w-4 rounded mr-3">Intaktný žiak - najrýchlejšie tempo</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Žiak z Ukrajiny" class="h-4 w-4 rounded mr-3">Žiak z Ukrajiny</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Žiak s ADHD" class="h-4 w-4 rounded mr-3">Žiak s ADHD</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Žiak s nadaním" class="h-4 w-4 rounded mr-3">Žiak s nadaním</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Žiak s PAS" class="h-4 w-4 rounded mr-3">Žiak s PAS</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="skupina" value="Žiak s dyslexiou" class="h-4 w-4 rounded mr-3">Žiak s dyslexiou</label>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-lg font-medium text-gray-700 mb-2">Typ výstupu:</label>
                    <div id="vystup-checkbox-group" class="space-y-2">
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="vystup" value="Kvíz" class="h-4 w-4 rounded mr-3">Kvíz</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="vystup" value="Príprava na vyučovanie" class="h-4 w-4 rounded mr-3">Príprava na vyučovanie</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="vystup" value="Pracovný list" class="h-4 w-4 rounded mr-3">Pracovný list</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="vystup" value="Hra" class="h-4 w-4 rounded mr-3">Hra</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="vystup" value="Projektové vyučovanie" class="h-4 w-4 rounded mr-3">Projektové vyučovanie</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="vystup" value="Test" class="h-4 w-4 rounded mr-3">Test</label>
                        <label class="flex items-center p-3 w-full border rounded-lg cursor-pointer"><input type="checkbox" name="vystup" value="Predikčná karta" class="h-4 w-4 rounded mr-3">Predikčná karta</label>
                    </div>
                </div>
            </div>

            <!-- File Upload -->
            <div>
                <label for="file-input" class="block text-lg font-medium text-gray-700 mb-2">
                    Nahraj súbor:
                </label>
                <label for="file-input"
                       class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="space-y-1 text-center">
                        <!-- Thumbnail Preview -->
                        <img id="file-thumbnail" src="" alt="Image preview" class="hidden mx-auto h-16 w-auto object-contain">
                        <!-- Default Placeholder -->
                        <div id="file-upload-placeholder">
                            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none"
                                 viewBox="0 0 48 48" aria-hidden="true">
                                <path
                                    d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <div class="flex text-base text-gray-600 justify-center">
                            <p class="pl-1" id="file-upload-text">Click to upload a file</p>
                        </div>
                        <p class="text-xs text-gray-500" id="file-upload-subtext">Images, TXT, PDF, etc.</p>
                    </div>
                </label>
                <input id="file-input" name="file-upload" type="file" class="sr-only">
            </div>

            <!-- Upload Progress -->
            <div id="progress-container" class="hidden">
                <div class="flex justify-between mb-1">
                    <span class="text-base font-medium text-blue-700">Loading file...</span>
                    <span class="text-sm font-medium text-blue-700" id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full progress-bar" style="width: 0%"
                         id="progress-bar"></div>
                </div>
            </div>

            <!-- Generate Button -->
            <button id="generate-btn"
                    class="w-full bg-blue-600 text-white font-bold text-lg p-4 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed"
                    disabled>
                Run Task
            </button>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="mt-10 hidden">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Results:</h2>
            <!-- Loading Indicator -->
            <div id="loading-indicator" class="hidden items-center space-x-2 text-gray-600">
                <svg class="animate-pulse h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 8v4l3 3m6-3-3-3-3 3" />
                </svg>
                <span id="loading-text">Processing your request...</span>
            </div>

            <!-- Text Output -->
            <div id="text-output"
                 class="w-full p-4 bg-gray-50 rounded-lg border border-gray-200 text-gray-800 whitespace-pre-wrap min-h-[100px] font-mono text-sm">
            </div>

            <!-- Audio Output -->
            <div id="audio-container" class="mt-4 hidden">
                <audio controls id="audio-player" class="w-full"></audio>
            </div>
        </div>
    </div>

    <!-- Custom Message Box (for alerts) -->
    <div id="message-box"
         class="fixed top-5 right-5 bg-red-600 text-white p-4 rounded-lg shadow-lg max-w-sm opacity-0 transform -translate-y-10"
         role="alert">
        <strong class="font-bold">Error!</strong>
        <span class="block sm:inline" id="message-text">Something went wrong.</span>
    </div>

    <!-- JavaScript Logic -->
    <script type="module" src="script.js"></script>
</body>
</html>
