<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI File Processor</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        pulse: {
                            '0%, 100%': { opacity: 1 },
                            '50%': { opacity: .5 },
                        }
                    },
                    animation: {
                        pulse: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
    <style>
        /* Base font */
        body {
            font-family: 'Inter', 'sans-serif';
        }

        /* Custom style for progress bar */
        .progress-bar {
            transition: width 0.3s ease-in-out;
        }

        /* Custom message box for alerts */
        #message-box {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Main Application Card -->
    <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl sm:text-4xl font-bold text-center text-gray-800 mb-8">
            AI File Processor
        </h1>

        <div class="space-y-6">

            <!-- API Selection -->
            <div>
                <label class="block text-lg font-medium text-gray-700 mb-3">
                    Select AI Provider:
                </label>
                <fieldset class="flex flex-col sm:flex-row sm:space-x-4 space-y-2 sm:space-y-0">
                    <label for="api-select-gemini"
                           class="flex items-center p-3 w-full border border-gray-300 rounded-lg has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 cursor-pointer">
                        <input type="radio" id="api-select-gemini" name="api-provider" value="gemini"
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300" checked>
                        <span class="ml-3 text-base font-medium text-gray-700">Gemini</span>
                    </label>
                    <label for="api-select-openai"
                           class="flex items-center p-3 w-full border border-gray-300 rounded-lg has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 cursor-pointer">
                        <input type="radio" id="api-select-openai" name="api-provider" value="openai"
                               class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                        <span class="ml-3 text-base font-medium text-gray-700">OpenAI</span>
                    </label>
                </fieldset>
            </div>

            <!-- Task Selection -->
            <div>
                <label for="select-menu" class="block text-lg font-medium text-gray-700 mb-2">
                    Select Task:
                </label>
                <select id="select-menu"
                        class="w-full p-3 border border-gray-300 rounded-lg bg-white text-gray-700 focus:ring-blue-500 focus:border-blue-500">
                    <option value="default" disabled selected>-- Choose an action --</option>
                    <option value="ocr">Do OCR</option>
                    <option value="summarize">Summarize</option>
                    <option value="read_aloud">Read Aloud (Text file only)</option>
                </select>
            </div>

            <!-- File Upload -->
            <div>
                <label for="file-input" class="block text-lg font-medium text-gray-700 mb-2">
                    Upload File:
                </label>
                <label for="file-input"
                       class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="space-y-1 text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none"
                             viewBox="0 0 48 48" aria-hidden="true">
                            <path
                                d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <div class="flex text-base text-gray-600">
                            <p class="pl-1" id="file-upload-text">Click to upload a file</p>
                        </div>
                        <p class="text-xs text-gray-500" id="file-upload-subtext">Images, TXT, PDF, etc.</p>
                    </div>
                </label>
                <input id="file-input" name="file-upload" type="file" class="sr-only">
            </div>

            <!-- Upload Progress -->
            <div id="progress-container" class="hidden">
                <div class="flex justify-between mb-1">
                    <span class="text-base font-medium text-blue-700">Loading file...</span>
                    <span class="text-sm font-medium text-blue-700" id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full progress-bar" style="width: 0%"
                         id="progress-bar"></div>
                </div>
            </div>

            <!-- Generate Button -->
            <button id="generate-btn"
                    class="w-full bg-blue-600 text-white font-bold text-lg p-4 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed"
                    disabled>
                Run Task
            </button>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="mt-10 hidden">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Results:</h2>
            <!-- Loading Indicator -->
            <div id="loading-indicator" class="hidden items-center space-x-2 text-gray-600">
                <svg class="animate-pulse h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 8v4l3 3m6-3-3-3-3 3" />
                </svg>
                <span id="loading-text">Processing your request...</span>
            </div>

            <!-- Text Output -->
            <div id="text-output"
                 class="w-full p-4 bg-gray-50 rounded-lg border border-gray-200 text-gray-800 whitespace-pre-wrap min-h-[100px] font-mono text-sm">
            </div>

            <!-- Audio Output -->
            <div id="audio-container" class="mt-4 hidden">
                <audio controls id="audio-player" class="w-full"></audio>
            </div>
        </div>
    </div>

    <!-- Custom Message Box (for alerts) -->
    <div id="message-box"
         class="fixed top-5 right-5 bg-red-600 text-white p-4 rounded-lg shadow-lg max-w-sm opacity-0 transform -translate-y-10"
         role="alert">
        <strong class="font-bold">Error!</strong>
        <span class="block sm:inline" id="message-text">Something went wrong.</span>
    </div>

    <!-- JavaScript Logic -->
    <script type="module">
        // --- Import API Keys ---
        // Keys are imported from the api-keys.js file.
        // Make sure that file exists and has your keys.
        import { GEMINI_API_KEY, OPENAI_API_KEY } from './api-keys.js';

        // --- DOM Elements ---
        const selectApiGemini = document.getElementById('api-select-gemini');
        const selectApiOpenAI = document.getElementById('api-select-openai');
        const selectMenu = document.getElementById('select-menu');
        const fileInput = document.getElementById('file-input');
        const fileUploadText = document.getElementById('file-upload-text');
        const fileUploadSubtext = document.getElementById('file-upload-subtext');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const generateBtn = document.getElementById('generate-btn');
        const resultsContainer = document.getElementById('results-container');
        const loadingIndicator = document.getElementById('loading-indicator');
        const loadingText = document.getElementById('loading-text');
        const textOutput = document.getElementById('text-output');
        const audioContainer = document.getElementById('audio-container');
        const audioPlayer = document.getElementById('audio-player');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');

        // --- App State ---
        let fileDataUrl = null;
        let fileMimeType = null;
        let fileTextContent = null; // For text files
        let currentAudioUrl = null; // To manage audio blob URLs

        // --- Prompt Definitions ---
        const prompts = {
            ocr: {
                system: "You are an Optical Character Recognition (OCR) specialist. Extract all text from the provided image, exactly as it appears. Do not add any commentary or formatting.",
                user: "Extract the text from this image."
            },
            summarize: {
                system: "You are a professional summarization assistant. Provide a concise, clear, and high-level summary of the provided content (image or text).",
                user: "Summarize the content of this file."
            },
            read_aloud: {
                system: "You will be given text. Read it aloud clearly and naturally.",
                user: "Read this text." // The user prompt isn't really used for TTS, the file content is.
            }
        };

        // --- Event Listeners ---
        fileInput.addEventListener('change', handleFileInput);
        selectMenu.addEventListener('change', checkFormValidity);
        selectApiGemini.addEventListener('change', checkFormValidity);
        selectApiOpenAI.addEventListener('change', checkFormValidity);
        generateBtn.addEventListener('click', runAiTask);

        // --- Form Logic ---
        function checkFormValidity() {
            const task = selectMenu.value;
            const fileSelected = !!fileDataUrl;
            
            // Re-enable button. No longer checking for API key input.
            generateBtn.disabled = !(task !== 'default' && fileSelected);
        }

        function handleFileInput(event) {
            const file = event.target.files[0];
            if (!file) {
                fileDataUrl = null;
                fileMimeType = null;
                fileTextContent = null;
                fileUploadText.textContent = "Click to upload a file";
                fileUploadSubtext.textContent = "Images, TXT, PDF, etc.";
                progressContainer.classList.add('hidden');
                checkFormValidity();
                return;
            }

            fileMimeType = file.type;
            fileUploadText.textContent = file.name;
            fileUploadSubtext.textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB`;

            const reader = new FileReader();
            
            // Show progress bar
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';

            reader.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percentLoaded = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = `${percentLoaded}%`;
                    progressPercent.textContent = `${percentLoaded}%`;
                }
            };

            reader.onload = (e) => {
                fileDataUrl = e.target.result;
                // If it's a text file, also read its text content for TTS
                if (fileMimeType.startsWith('text/')) {
                    // Handle different text encodings, defaulting to utf-8
                    try {
                        const base64Data = fileDataUrl.split(',')[1];
                        const binaryString = atob(base64Data);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }
                        // Use TextDecoder for robust string conversion
                        const decoder = new TextDecoder('utf-8'); // You could also try 'latin1' etc.
                        fileTextContent = decoder.decode(bytes);
                    } catch (e) {
                        console.error("Error decoding base64 text: ", e);
                        // Fallback for simple text
                        fileTextContent = atob(fileDataUrl.split(',')[1]);
                    }
                } else {
                    fileTextContent = null;
                }
                progressBar.style.width = '100%';
                progressPercent.textContent = '100%';
                checkFormValidity();
            };

            reader.onerror = () => {
                showError("Error reading file.");
                fileDataUrl = null;
                progressContainer.classList.add('hidden');
                checkFormValidity();
            };
            
            // Read as Data URL (base64)
            reader.readAsDataURL(file);
        }

        // --- Main Task Orchestrator ---
        async function runAiTask() {
            const selectedApi = document.querySelector('input[name="api-provider"]:checked').value;
            const selectedTask = selectMenu.value;

            // Get the correct key from the imported constants
            const apiKey = (selectedApi === 'gemini') ? GEMINI_API_KEY : OPENAI_API_KEY;

            // Check if the keys are still placeholders
            if (!apiKey || apiKey.includes("YOUR_")) {
                showError("API Key is not set. Please edit api-keys.js and add your API keys.");
                textOutput.textContent = "API Key is not set. Please edit api-keys.js and add your API keys.";
                resultsContainer.classList.remove('hidden');
                return;
            }

            // Updated check
            if (!selectedApi || !selectedTask || !fileDataUrl) {
                showError("Please select an API, a task, and upload a file.");
                return;
            }

            // Reset UI
            setLoading(true);
            textOutput.textContent = "";
            audioContainer.classList.add('hidden');
            if (currentAudioUrl) {
                URL.revokeObjectURL(currentAudioUrl); // Clean up old audio blob
                currentAudioUrl = null;
            }

            const promptData = prompts[selectedTask];
            const base64Data = fileDataUrl.split(',')[1];

            try {
                if (selectedTask === 'read_aloud') {
                    if (!fileTextContent) {
                        throw new Error("Please upload a text file (.txt, .md, etc.) for the 'Read Aloud' task.");
                    }
                    loadingText.textContent = "Generating audio...";
                    const audioBlob = await fetchTTS(selectedApi, apiKey, fileTextContent);
                    const audioUrl = URL.createObjectURL(audioBlob);
                    currentAudioUrl = audioUrl;
                    audioPlayer.src = audioUrl;
                    audioContainer.classList.remove('hidden');
                    textOutput.textContent = "Audio generated successfully.";
                } else {
                    // OCR or Summarize
                    loadingText.textContent = "Analyzing file...";
                    // Check for non-image/text mimetypes that vision models might reject
                    let effectiveMimeType = fileMimeType;
                    if (fileMimeType === 'application/pdf') {
                        // Vision models often prefer this specific type for PDFs
                        effectiveMimeType = 'application/pdf';
                    } else if (!fileMimeType.startsWith('image/')) {
                        // Fallback for things like docx, etc. Let's try to treat it as a generic blob if not an image.
                        // For this demo, we'll focus on images and PDFs as primary vision inputs.
                        // A more complex app would convert DOCX/PDF to images first.
                        // We will rely on the API to handle common types like PNG, JPEG, WEBP, PDF.
                        console.warn(`Unsupported MIME type for vision: ${fileMimeType}. Proceeding, but API may fail.`);
                    }

                    const resultText = await fetchVision(selectedApi, apiKey, promptData, base64Data, effectiveMimeType);
                    textOutput.textContent = resultText;
                }
            } catch (error) {
                console.error("Task failed:", error);
                showError(error.message);
                textOutput.textContent = `Error: ${error.message}`;
            } finally {
                setLoading(false);
            }
        }

        // --- API Call Functions ---

        /**
         * Fetches a multimodal (vision) response from the selected API.
         */
        async function fetchVision(api, key, promptData, base64Data, mimeType) {
            let url, payload, headers;
            headers = { "Content-Type": "application/json" };

            if (api === 'gemini') {
                url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`;
                payload = {
                    systemInstruction: { parts: [{ text: promptData.system }] },
                    contents: [{
                        parts: [
                            { text: promptData.user },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ]
                    }]
                };
            } else { // openai
                url = "https://api.openai.com/v1/chat/completions";
                headers["Authorization"] = `Bearer ${key}`;
                
                // OpenAI (gpt-4o) expects image_url for images. 
                // For other file types like PDF, it's more complex and often requires a different endpoint or process.
                // This simplified demo will assume images for OpenAI vision.
                if (!mimeType.startsWith('image/')) {
                    throw new Error(`OpenAI (gpt-4o) in this demo only supports images for vision. You uploaded: ${mimeType}`);
                }
                
                payload = {
                    model: "gpt-4o",
                    messages: [
                        { role: "system", content: promptData.system },
                        {
                            role: "user",
                            content: [
                                { type: "text", text: promptData.user },
                                { type: "image_url", image_url: { url: `data:${mimeType};base64,${base64Data}` } }
                            ]
                        }
                    ],
                    max_tokens: 2000
                };
            }

            const response = await fetchWithRetry(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error("API Error Data:", errorData);
                throw new Error(`API Error (${response.status}): ${errorData.error?.message || response.statusText}`);
            }

            const result = await response.json();

            if (api === 'gemini') {
                return result.candidates[0]?.content?.parts[0]?.text || "No content returned.";
            } else { // openai
                return result.choices[0]?.message?.content || "No content returned.";
            }
        }

        /**
         * Fetches a text-to-speech (TTS) response from the selected API.
         * Returns an audio blob.
         */
        async function fetchTTS(api, key, text) {
            let url, payload, headers;

            if (api === 'gemini') {
                url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${key}`;
                headers = { "Content-Type": "application/json" };
                payload = {
                    contents: [{
                        parts: [{ text: `Read this: ${text}` }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            speechContexts: [],
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("Gemini TTS Error Data:", errorData);
                    throw new Error(`Gemini TTS API Error (${response.status}): ${errorData.error?.message || response.statusText}`);
                }
                const result = await response.json();
                const audioPart = result.candidates[0]?.content?.parts[0];
                if (!audioPart || !audioPart.inlineData) throw new Error("No audio data returned from Gemini.");
                
                // Convert base64 PCM to a WAV blob
                const pcmData = base64ToArrayBuffer(audioPart.inlineData.data);
                const pcm16 = new Int16Array(pcmData);
                const sampleRateMatch = audioPart.inlineData.mimeType.match(/rate=(\d+)/);
                const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000; // Default 24kHz
                return pcmToWav(pcm16, sampleRate);

            } else { // openai
                url = "https://api.openai.com/v1/audio/speech";
                headers = {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                };
                payload = {
                    model: "tts-1",
                    input: text,
                    voice: "alloy"
                };
                
                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const errorData = await response.json(); // OpenAI might not send JSON on error, but good to try
                    console.error("OpenAI TTS Error Data:", errorData);
                    throw new Error(`OpenAI TTS API Error (${response.status}): ${errorData.error?.message || response.statusText}`);
                }
                return await response.blob(); // OpenAI returns an MP3 blob directly
            }
        }

        /**
         * A wrapper for fetch that includes exponential backoff and retry logic.
         */
        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                // Retry on rate limit (429) or server errors (5xx)
                if (!response.ok && (response.status === 429 || response.status >= 500) && retries > 0) {
                    console.warn(`Retrying request: ${response.status}. Retries left: ${retries}`);
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                return response;
            } catch (error) {
                // Retry on network errors
                if (retries > 0) {
                    console.warn(`Retrying request after network error: ${error.message}. Retries left: ${retries}`);
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw new Error(`Network error or max retries exceeded: ${error.message}`);
            }
        }

        // --- UI Helpers ---

        function setLoading(isLoading) {
            if (isLoading) {
                resultsContainer.classList.remove('hidden');
                loadingIndicator.classList.remove('hidden');
                loadingIndicator.classList.add('flex');
                generateBtn.disabled = true;
                generateBtn.textContent = "Processing...";
            } else {
                loadingIndicator.classList.add('hidden');
                loadingIndicator.classList.remove('flex');
                generateBtn.disabled = false;
                generateBtn.textContent = "Run Task";
                checkFormValidity(); // Re-check validity (e.g., file might still be selected)
            }
        }

        function showError(message) {
            messageText.textContent = message;
            messageBox.classList.remove('opacity-0', '-translate-y-10');
            messageBox.classList.add('opacity-100', 'translate-y-0');
            
            // Auto-hide the message
            setTimeout(() => {
                messageBox.classList.remove('opacity-100', 'translate-y-0');
                messageBox.classList.add('opacity-0', '-translate-y-10');
            }, 5000); // Hide after 5 seconds
        }

        // --- Audio Utilities ---

        /**
         * Decodes base64 string to an ArrayBuffer.
         */
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        /**
         * Converts raw PCM audio data (Int16Array) to a WAV file Blob.
         * This is necessary for playing the raw audio data from Gemini TTS in a browser.
         */
        function pcmToWav(pcmData, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcmData.length * (bitsPerSample / 8);
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            // RIFF header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true); // file size - 8
            writeString(view, 8, 'WAVE');

            // fmt chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // chunk size
            view.setUint16(20, 1, true); // audio format (1 = PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);

            // data chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            // Write PCM data
            for (let i = 0; i < pcmData.length; i++) {
                view.setInt16(44 + i * 2, pcmData[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

        /**
         * Helper to write a string to a DataView.
         */
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // --- Initial Check ---
        checkFormValidity();

    </script>
</body>
</html>
